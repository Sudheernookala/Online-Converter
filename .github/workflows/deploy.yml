name: Deploy to GitHub Pages

# The site is plain HTML/JS with no build step, so it is published as-is.
# (It also works if Pages is set to "Deploy from a branch".)
on:
  push:
    branches: [main, claude/happy-archimedes-o7jqsl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
