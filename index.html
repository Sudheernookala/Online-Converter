<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert a Word (.docx) file to a high-resolution PDF in your browser." />
    <title>Word to PDF</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23d93025'/><text x='16' y='21' font-size='11' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>PDF</text></svg>" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Word to PDF</h1>
      <p class="lead">Choose a Word file. It is converted to a high-resolution PDF and downloaded automatically. Your file stays on your device.</p>

      <label id="drop" class="drop" tabindex="0">
        <input id="file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
        <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true"><path fill="currentColor" d="M19 15v4H5v-4H3v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4h-2ZM11 5.83V16h2V5.83l3.59 3.58L18 8l-6-6-6 6 1.41 1.41L11 5.83Z"/></svg>
        <strong id="drop-title">Choose a Word file (.docx)</strong>
        <span>or drop it here</span>
      </label>

      <section id="status" class="box" hidden aria-live="polite">
        <p id="status-text"></p>
        <div class="bar"><div id="bar-fill"></div></div>
      </section>

      <section id="result" class="box" hidden>
        <p id="result-text"></p>
        <p id="warning" class="warning" hidden></p>
        <div class="actions">
          <a id="download" class="btn primary" download>Download PDF again</a>
          <button id="again" class="btn" type="button">Convert another file</button>
        </div>
      </section>

      <p id="error" class="box error" hidden role="alert"></p>
    </main>

    <!-- Off-screen area where the document is laid out before it is captured. -->
    <div id="stage" aria-hidden="true"></div>

    <script src="vendor/jszip.min.js"></script>
    <script src="vendor/docx-preview.min.js"></script>
    <script src="vendor/jspdf.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>
    <script>
      // If the app code fails to load, say so instead of silently doing nothing.
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (window.__converterReady) return;
          var box = document.getElementById('error');
          box.textContent = 'The converter failed to load. Please refresh the page (Ctrl+Shift+R).';
          box.hidden = false;
        }, 3000);
      });
    </script>
  </body>
</html>
